site_name: sytax
site_description: "Syrian salary and compensation taxes from the command line: gross to net, net to gross, salary scales."
site_url: https://aaltatan.github.io/syriantaxescli/
repo_url: https://github.com/aaltatan/syriantaxescli
repo_name: aaltatan/syriantaxescli
edit_uri: edit/main/docs/
copyright: GPL-3.0-or-later


theme:
  name: material
  icon:
    logo: material/calculator-variant-outline
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - toc.follow

nav:
  - Home: index.md
  - Installation: install.md
  - User guide:
      - guide/index.md
      - Gross to net: guide/gross.md
      - Net to gross: guide/net.md
      - Salary scales: guide/range.md
      - Output and export: guide/output.md
      - The tax rules: guide/rules.md
      - Configuration: guide/configuration.md
      - Presets and law changes: guide/presets.md
  - Recipes: recipes.md
  - Reference:
      - reference/index.md
      - Commands and options: reference/commands.md
      - Settings: reference/settings.md
      - Environment variables: reference/environment.md
      - Errors and exit codes: reference/errors.md
      - Upgrading from 0.1: reference/upgrading.md
  - Development: development.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aaltatan/syriantaxescli
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/syriantaxescli/
